[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trice"
version = "0.3.0"
description = "Whole-organism computational simulation and AI research framework"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Raghav549"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
numeric = ["numpy>=1.24"]
ml = ["torch>=2.1", "jax>=0.4", "tensorflow>=2.14"]
data = ["pandas>=2.0", "polars>=0.20"]
distributed = ["ray>=2.8", "dask[complete]>=2023.10", "pyspark>=3.5"]
tracking = ["wandb>=0.16", "mlflow>=2.9"]
tests = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.13", "build>=1.2", "twine>=6"]
all = [
  "numpy>=1.24",
  "torch>=2.1",
  "jax>=0.4",
  "tensorflow>=2.14",
  "pandas>=2.0",
  "polars>=0.20",
  "ray>=2.8",
  "dask[complete]>=2023.10",
  "pyspark>=3.5",
  "wandb>=0.16",
  "mlflow>=2.9",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
  "mypy>=1.13",
  "build>=1.2",
  "twine>=6",
]

[project.scripts]
trice = "trice.cli:main"

[tool.setuptools.packages.find]
include = ["trice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
